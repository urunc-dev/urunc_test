name: urunc fuzzing (corpus pruning)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *'

permissions:
  contents: read

# Shared with fuzz_batch.yml. Both download the corpus, change it and upload
# it again, so overlapping runs would overwrite each other's corpus.
concurrency:
  group: clusterfuzzlite-corpus
  cancel-in-progress: false

jobs:
  prune:
    name: Corpus pruning
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/fuzz.yml
    with:
      mode: prune
      fuzz-seconds: 600
